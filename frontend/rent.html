<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rent Properties — HomelyNG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .bg-brand-green { background-color: #064e3b; }
    .text-brand-green { color: #064e3b; }
    .hover\:bg-brand-green-dark:hover { background-color: #053a2c; }
    #map { height: 100%; width: 100%; border-radius: 0.5rem; z-index: 0; }
    .map-pin { background: #064e3b; color: white; border-radius: 9999px; padding: 5px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.25); border: 2px solid white; cursor: pointer; }
    input[type="range"] { -webkit-appearance: none; height: 4px; background: #facc15; border-radius: 9999px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 9999px; background: white; border: 2px solid #facc15; cursor: pointer; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="landing.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-md bg-yellow-400 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5M5 9.5V21h14V9.5" /></svg>
        </div>
        <span class="text-gray-900 font-bold text-xl">HomelyNG</span>
      </a>
      <ul class="hidden md:flex items-center gap-8 text-sm font-medium">
        <li><a href="search.html"         class="text-gray-600 hover:text-gray-900">Buy</a></li>
        <li><a href="rent.html"           class="text-yellow-500 border-b-2 border-yellow-500 pb-1">Rent</a></li>
        <li><a href="lease.html"          class="text-gray-600 hover:text-gray-900">Lease</a></li>
        <li><a href="international.html"  class="text-gray-600 hover:text-gray-900">International</a></li>
        <li><a href="about.html"          class="text-gray-600 hover:text-gray-900">About</a></li>
        <li><a href="contact.html"        class="text-gray-600 hover:text-gray-900">Contact</a></li>
      </ul>
      <div class="flex items-center gap-3">
        <a href="login.html" class="border border-gray-300 text-gray-800 text-sm font-medium px-4 py-2 rounded-lg hover:bg-gray-50 transition">Login</a>
        <a href="login.html" class="bg-brand-green hover:bg-brand-green-dark text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Sign Up</a>
      </div>
    </nav>
  </header>

  <div class="max-w-7xl mx-auto px-6 pt-6">
    <div class="flex items-center gap-2 mb-4 text-sm">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
      <span class="font-medium text-gray-800">Showing 84 properties for Rent</span>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Location</label>
        <input type="text" placeholder="e.g. Ikoyi, Lekki" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Property Type</label>
        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none">
          <option>Any</option><option>Apartment</option><option>Duplex</option><option>Flat</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Bedrooms</label>
        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none">
          <option>Any</option><option>1+</option><option>2+</option><option>3+</option><option>4+</option>
        </select>
      </div>
      <div class="flex items-end">
        <button class="w-full bg-brand-green hover:bg-brand-green-dark text-white font-semibold text-sm px-4 py-2 rounded-lg transition">Apply Filters</button>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 pb-12 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
      <div id="property-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>
    </div>
    <div class="lg:col-span-1">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden h-[720px] flex flex-col">
        <div class="px-5 py-4 border-b border-gray-100"><h3 class="font-semibold text-gray-900">Map View</h3></div>
        <div class="flex-1 p-3"><div id="map"></div></div>
      </div>
    </div>
  </div>

  <script>
    const allProperties = [
      { id: 2,  title: "4 Bedroom Luxury Apartment",   price: "₦8,500,000 / year", location: "Lekki Phase 1, Lagos",        beds: 4, baths: 4, sqm: 280, tag: "For Rent", coords: [6.4478, 3.4723], image: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=800&q=80" },
      { id: 4,  title: "3 Bedroom Apartment",          price: "₦5,500,000 / year", location: "Victoria Island, Lagos",      beds: 3, baths: 5, sqm: 220, tag: "For Rent", coords: [6.4281, 3.4219], image: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=800&q=80" },
      { id: 6,  title: "3 Bedroom Penthouse Apartment",price: "₦18,000,000 / year",location: "Banana Island, Ikoyi, Lagos", beds: 3, baths: 4, sqm: 260, tag: "For Rent", coords: [6.4446, 3.4440], image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80" },
      { id: 8,  title: "2 Bedroom Flat",               price: "₦3,200,000 / year", location: "Yaba, Lagos",                 beds: 2, baths: 2, sqm: 120, tag: "For Rent", coords: [6.5076, 3.3713], image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=800&q=80" },
      { id: 10, title: "Studio Apartment",             price: "₦1,800,000 / year", location: "Surulere, Lagos",             beds: 1, baths: 1, sqm: 60,  tag: "For Rent", coords: [6.5017, 3.3587], image: "https://images.unsplash.com/photo-1502672023488-70e25813eb80?auto=format&fit=crop&w=800&q=80" },
      { id: 12, title: "3 Bedroom Bungalow",           price: "₦4,000,000 / year", location: "Ikeja, Lagos",                beds: 3, baths: 3, sqm: 180, tag: "For Rent", coords: [6.6018, 3.3515], image: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=800&q=80" }
    ];

    const grid = document.getElementById('property-grid');
    allProperties.forEach(p => {
      grid.innerHTML += `
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-lg transition group">
          <div class="relative h-48 overflow-hidden">
            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${p.title}" />
            <span class="absolute top-3 left-3 bg-yellow-400 text-gray-900 text-xs font-semibold px-2.5 py-1 rounded">${p.tag}</span>
          </div>
          <div class="p-4">
            <p class="font-bold text-gray-900 text-base">${p.price}</p>
            <h3 class="text-sm text-gray-800 mt-1 mb-2">${p.title}</h3>
            <p class="text-xs text-gray-500 mb-3">📍 ${p.location}</p>
            <div class="flex items-center gap-3 text-xs text-gray-600 border-t border-gray-100 pt-3 mb-3">
              <span>${p.beds} Beds</span><span>•</span><span>${p.baths} Baths</span><span>•</span><span>${p.sqm} sqm</span>
            </div>
            <a href="property.html?id=${p.id}" class="block text-center w-full border border-gray-300 hover:bg-gray-50 text-gray-800 text-sm font-medium py-2 rounded-lg transition">View Details</a>
          </div>
        </div>`;
    });

    const map = L.map('map').setView([6.45, 3.45], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
    allProperties.forEach(p => {
      const icon = L.divIcon({ className: 'custom-pin', html: `<div class="map-pin">${p.location.split(',')[0]}</div>`, iconSize: [80, 30], iconAnchor: [40, 15] });
      L.marker(p.coords, { icon }).addTo(map).bindPopup(`<strong>${p.title}</strong><br />${p.price}<br /><a href="property.html?id=${p.id}" style="color:#064e3b;">View →</a>`);
    });
  </script>
</body>
</html>
