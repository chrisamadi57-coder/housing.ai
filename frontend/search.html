<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomelyNG — Search Properties</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .bg-brand-green { background-color: #064e3b; }
    .text-brand-green { color: #064e3b; }
    .hover\:bg-brand-green-dark:hover { background-color: #053a2c; }

    #map { height: 100%; width: 100%; border-radius: 0.5rem; z-index: 0; }
    #full-map { height: 100%; width: 100%; }

    /* Map pins */
    .map-pin {
      background: #064e3b;
      color: white;
      border-radius: 9999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      border: 2px solid white;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .map-pin:hover {
      background: #facc15;
      color: #064e3b;
      transform: scale(1.1);
    }

    /* Range slider */
    input[type="range"] {
      /* webkit-appearance: none; */
      height: 4px;
      background: #facc15;
      border-radius: 9999px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 9999px;
      background: white;
      border: 2px solid #facc15;
      cursor: pointer;
    }

    /* Full-map modal */
    #full-map-modal {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #full-map-modal.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

  <!-- ================= NAVBAR ================= -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="landing.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-md bg-yellow-400 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5M5 9.5V21h14V9.5" />
          </svg>
        </div>
        <span class="text-gray-900 font-bold text-xl">HomelyNG</span>
      </a>
        <ul class="hidden md:flex items-center gap-8 text-sm font-medium">
        <li><a href="search.html">Buy</a></li>
        <li><a href="rent.html">Rent</a></li>
        <li><a href="lease.html">Lease</a></li>
        <li><a href="international.html">International</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        </ul>
      <div class="flex items-center gap-3">
        <a href="login.html" class="border border-gray-300 text-gray-800 text-sm font-medium px-4 py-2 rounded-lg hover:bg-gray-50 transition">Login</a>
        <a href="login.html" class="bg-brand-green hover:bg-brand-green-dark text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Sign Up</a>
      </div>
    </nav>
  </header>

  <!-- ================= RESULT BAR ================= -->
  <div class="max-w-7xl mx-auto px-6 pt-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
      <div class="flex items-center gap-3 text-sm">
        <span class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
          <span class="font-medium text-gray-800">Showing 248 properties in Lagos • Buy</span>
        </span>
        <button class="flex items-center gap-1 text-gray-500 hover:text-gray-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
          Clear filters
        </button>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span class="text-gray-500">Sort by:</span>
        <select class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
          <option>Newest</option>
          <option>Price: Low to High</option>
          <option>Price: High to Low</option>
          <option>Most Popular</option>
        </select>
      </div>
    </div>

    <!-- ================= FILTER BAR ================= -->
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-6">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Location</label>
        <input type="text" placeholder="e.g. Ikoyi, Lekki"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Property Type</label>
        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
          <option>Any</option>
          <option>Apartment</option>
          <option>Duplex</option>
          <option>Land</option>
        </select>
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-medium text-gray-600 mb-1">Price Range</label>
        <div class="px-3 pt-1">
          <div class="text-xs text-gray-700 mb-1">₦20,000,000 – ₦250,000,000</div>
          <input type="range" min="0" max="500000000" value="250000000" class="w-full" />
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Bedrooms</label>
        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
          <option>Any</option>
          <option>1+</option>
          <option>2+</option>
          <option>3+</option>
          <option>4+</option>
          <option>5+</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Bathrooms</label>
        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
          <option>Any</option>
          <option>1+</option>
          <option>2+</option>
          <option>3+</option>
          <option>4+</option>
        </select>
      </div>
      <div class="flex items-end">
        <button class="w-full bg-brand-green hover:bg-brand-green-dark text-white font-semibold text-sm px-4 py-2 rounded-lg flex items-center justify-center gap-2 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
          </svg>
          Apply Filters
        </button>
      </div>
    </div>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="max-w-7xl mx-auto px-6 pb-12 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- ==== LEFT: PROPERTY GRID ==== -->
    <div class="lg:col-span-2">
      <div id="property-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>

      <!-- PAGINATION -->
      <div class="flex items-center justify-center gap-2 mt-10">
        <button id="prev-btn"
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed transition">
          Previous
        </button>
        <div id="page-numbers" class="flex items-center gap-1"></div>
        <button id="next-btn"
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed transition">
          Next
        </button>
      </div>
    </div>

    <!-- ==== RIGHT: MAP ==== -->
    <div class="lg:col-span-1">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden h-[720px] flex flex-col">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="font-semibold text-gray-900">Map View</h3>
          <button class="text-gray-400 hover:text-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
            </svg>
          </button>
        </div>

        <div class="flex-1 p-3">
          <div id="map"></div>
        </div>

        <div class="p-4 border-t border-gray-100">
          <button id="open-full-map"
            class="w-full bg-brand-green hover:bg-brand-green-dark text-white font-semibold text-sm py-3 rounded-lg flex items-center justify-center gap-2 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
            </svg>
            View Full Map
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= FULL MAP MODAL ================= -->
  <div id="full-map-modal" class="fixed inset-0 bg-black/70 z-50 p-4 sm:p-8">
    <div class="bg-white rounded-2xl w-full h-full flex flex-col overflow-hidden shadow-2xl">

      <!-- Modal header -->
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <div>
          <h3 class="font-bold text-gray-900 text-lg">All Properties on Map</h3>
          <p class="text-xs text-gray-500">Click a pin to see details • Drag to explore</p>
        </div>
        <button id="close-full-map"
          class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Full map container -->
      <div class="flex-1 relative">
        <div id="full-map"></div>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    /* ---------- PROPERTY DATA ---------- */
    const allProperties = [
      { id: 1,  title: "5 Bedroom Detached Duplex",  price: "₦185,000,000", location: "Ikoyi, Lagos",           beds: 5, baths: 6, sqm: 420, tag: "For Sale", coords: [6.4541, 3.4346], image: "https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=800&q=80" },
      { id: 2,  title: "4 Bedroom Luxury Apartment",  price: "₦8,500,000 / year", location: "Lekki Phase 1, Lagos", beds: 4, baths: 4, sqm: 280, tag: "For Rent", coords: [6.4478, 3.4723], image: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=800&q=80" },
      { id: 3,  title: "4 Bedroom Semi-Detached Duplex", price: "₦135,000,000", location: "Chevron, Lekki, Lagos", beds: 4, baths: 5, sqm: 280, tag: "For Sale", coords: [6.4401, 3.5374], image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" },
      { id: 4,  title: "3 Bedroom Apartment",        price: "₦5,500,000 / year", location: "Victoria Island, Lagos", beds: 3, baths: 5, sqm: 220, tag: "For Rent", coords: [6.4281, 3.4219], image: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=800&q=80" },
      { id: 5,  title: "5 Bedroom Detached House",   price: "₦95,000,000",   location: "Ajah, Lagos",             beds: 5, baths: 5, sqm: 350, tag: "For Sale", coords: [6.4698, 3.5852], image: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=800&q=80" },
      { id: 6,  title: "3 Bedroom Penthouse Apartment", price: "₦18,000,000 / year", location: "Banana Island, Ikoyi, Lagos", beds: 3, baths: 4, sqm: 260, tag: "For Rent", coords: [6.4446, 3.4440], image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80" },
      { id: 7,  title: "6 Bedroom Mansion",          price: "₦450,000,000",  location: "Maitama, Abuja",        beds: 6, baths: 7, sqm: 800, tag: "For Sale", coords: [9.0765, 7.3986], image: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80" },
      { id: 8,  title: "2 Bedroom Flat",             price: "₦3,200,000 / year", location: "Yaba, Lagos",        beds: 2, baths: 2, sqm: 120, tag: "For Rent", coords: [6.5076, 3.3713], image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=800&q=80" },
      { id: 9,  title: "4 Bedroom Terrace Duplex",   price: "₦120,000,000",  location: "Gwarinpa, Abuja",       beds: 4, baths: 5, sqm: 300, tag: "For Sale", coords: [9.1110, 7.4049], image: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80" },
      { id: 10, title: "Studio Apartment",           price: "₦1,800,000 / year", location: "Surulere, Lagos",    beds: 1, baths: 1, sqm: 60,  tag: "For Rent", coords: [6.5017, 3.3587], image: "https://images.unsplash.com/photo-1502672023488-70e25813eb80?auto=format&fit=crop&w=800&q=80" },
      { id: 11, title: "5 Bedroom Duplex",           price: "₦220,000,000",  location: "Asokoro, Abuja",        beds: 5, baths: 6, sqm: 450, tag: "For Sale", coords: [9.0423, 7.5223], image: "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=800&q=80" },
      { id: 12, title: "3 Bedroom Bungalow",         price: "₦4,000,000 / year", location: "Ikeja, Lagos",       beds: 3, baths: 3, sqm: 180, tag: "For Rent", coords: [6.6018, 3.3515], image: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=800&q=80" },
    ];

    /* Duplicate for 3 pages */
    const properties = [];
    for (let i = 0; i < 3; i++) {
      allProperties.forEach(p => properties.push({ ...p, id: p.id + i * 100 }));
    }

    const PER_PAGE = 6;
    let currentPage = 1;
    const totalPages = Math.ceil(properties.length / PER_PAGE);

    /* ---------- RENDER CARDS ---------- */
    function renderCards(page) {
      const grid = document.getElementById('property-grid');
      grid.innerHTML = '';
      const start = (page - 1) * PER_PAGE;
      const pageItems = properties.slice(start, start + PER_PAGE);

      pageItems.forEach(p => {
        const tagColor = p.tag === 'For Sale'
          ? 'bg-brand-green text-white'
          : 'bg-yellow-400 text-gray-900';

        grid.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-lg transition group">
            <div class="relative h-48 overflow-hidden">
              <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
              <span class="absolute top-3 left-3 ${tagColor} text-xs font-semibold px-2.5 py-1 rounded">${p.tag}</span>
              <button class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/90 hover:bg-white flex items-center justify-center transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
              </button>
            </div>
            <div class="p-4">
              <p class="font-bold text-gray-900 text-base">${p.price}</p>
              <h3 class="text-sm text-gray-800 mt-1 mb-2">${p.title}</h3>
              <p class="text-xs text-gray-500 flex items-center gap-1 mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                ${p.location}
              </p>
              <div class="flex items-center gap-3 text-xs text-gray-600 border-t border-gray-100 pt-3 mb-3">
                <span>${p.beds} Beds</span>
                <span>•</span>
                <span>${p.baths} Baths</span>
                <span>•</span>
                <span>${p.sqm} sqm</span>
              </div>
              <a href="property.html?id=${p.id}" class="block text-center w-full border border-gray-300 hover:bg-gray-50 text-gray-800 text-sm font-medium py-2 rounded-lg transition">
                View Details
              </a>
            </div>
          </div>
        `;
      });
    }

    /* ---------- PAGINATION ---------- */
    function renderPagination() {
      const container = document.getElementById('page-numbers');
      container.innerHTML = '';

      const pages = [];
      if (totalPages <= 7) {
        for (let i = 1; i <= totalPages; i++) pages.push(i);
      } else {
        pages.push(1);
        if (currentPage > 3) pages.push('...');
        for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) pages.push(i);
        if (currentPage < totalPages - 2) pages.push('...');
        pages.push(totalPages);
      }

      pages.forEach(p => {
        if (p === '...') {
          container.innerHTML += `<span class="px-2 text-gray-400 text-sm">…</span>`;
        } else {
          const active = p === currentPage;
          container.innerHTML += `
            <button onclick="goToPage(${p})"
              class="min-w-[40px] h-10 rounded-lg text-sm font-medium transition
                ${active ? 'bg-brand-green text-white' : 'border border-gray-300 text-gray-700 hover:bg-gray-100'}">
              ${p}
            </button>`;
        }
      });

      document.getElementById('prev-btn').disabled = currentPage === 1;
      document.getElementById('next-btn').disabled = currentPage === totalPages;
    }

    function goToPage(page) {
      if (page < 1 || page > totalPages || page === currentPage) return;
      currentPage = page;
      renderCards(currentPage);
      renderPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('prev-btn').addEventListener('click', () => goToPage(currentPage - 1));
    document.getElementById('next-btn').addEventListener('click', () => goToPage(currentPage + 1));

    renderCards(1);
    renderPagination();

    /* ---------- LEAFLET MAP (SIDEBAR) ---------- */
    const map = L.map('map', { center: [6.45, 3.45], zoom: 11 });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19,
    }).addTo(map);

    /* Add all property pins to the sidebar map */
    allProperties.forEach(p => {
      const icon = L.divIcon({
        className: 'custom-pin',
        html: `<div class="map-pin">${p.location.split(',')[0]}</div>`,
        iconSize: [80, 30],
        iconAnchor: [40, 15],
      });

      L.marker(p.coords, { icon })
        .addTo(map)
        .bindPopup(`
          <div style="min-width:180px;">
            <img src="${p.image}" style="width:100%;height:90px;object-fit:cover;border-radius:6px;margin-bottom:6px;" />
            <strong style="font-size:13px;">${p.title}</strong><br />
            <span style="color:#064e3b;font-weight:600;">${p.price}</span><br />
            <a href="property.html?id=${p.id}" style="color:#064e3b;font-size:12px;">View details →</a>
          </div>
        `);
    });

    /* ---------- FULL SCREEN MAP ---------- */
    let fullMap = null;

    function openFullMap() {
      const modal = document.getElementById('full-map-modal');
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';

      // Initialize map the FIRST time it opens
      if (!fullMap) {
        fullMap = L.map('full-map', { center: [7.5, 5.5], zoom: 6 });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap',
          maxZoom: 19,
        }).addTo(fullMap);

        allProperties.forEach(p => {
          const icon = L.divIcon({
            className: 'custom-pin',
            html: `<div class="map-pin">${p.location.split(',')[0]}</div>`,
            iconSize: [80, 30],
            iconAnchor: [40, 15],
          });

          L.marker(p.coords, { icon })
            .addTo(fullMap)
            .bindPopup(`
              <div style="min-width:180px;">
                <img src="${p.image}" style="width:100%;height:90px;object-fit:cover;border-radius:6px;margin-bottom:6px;" />
                <strong style="font-size:13px;">${p.title}</strong><br />
                <span style="color:#064e3b;font-weight:600;">${p.price}</span><br />
                <a href="property.html?id=${p.id}" style="color:#064e3b;font-size:12px;">View details →</a>
              </div>
            `);
        });
      }

      // Leaflet needs a size recalculation after the container becomes visible
      setTimeout(() => fullMap.invalidateSize(), 150);
    }

    function closeFullMap() {
      const modal = document.getElementById('full-map-modal');
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('open-full-map').addEventListener('click', openFullMap);
    document.getElementById('close-full-map').addEventListener('click', closeFullMap);

    // Close when clicking outside the panel
    document.getElementById('full-map-modal').addEventListener('click', (e) => {
      if (e.target.id === 'full-map-modal') closeFullMap();
    });

    // Close with ESC key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeFullMap();
    });
  </script>

</body>
</html>
