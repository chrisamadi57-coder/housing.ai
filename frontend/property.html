<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomelyNG — Property Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .bg-brand-green { background-color: #064e3b; }
    .text-brand-green { color: #064e3b; }
    .hover\:bg-brand-green-dark:hover { background-color: #053a2c; }

    #property-map { height: 320px; width: 100%; border-radius: 0.75rem; z-index: 0; }

    .map-pin {
      background: #064e3b;
      color: white;
      border-radius: 9999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      border: 2px solid white;
    }

    /* Gallery thumbnails */
    .thumb-active { border-color: #064e3b !important; opacity: 1 !important; }
    .thumb { opacity: 0.6; transition: all 0.2s ease; }

    /* Lightbox */
    #lightbox {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

  <!-- ================= NAVBAR ================= -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="landing.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-md bg-yellow-400 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5M5 9.5V21h14V9.5" />
          </svg>
        </div>
        <span class="text-gray-900 font-bold text-xl">HomelyNG</span>
      </a>

      <ul class="hidden md:flex items-center gap-8 text-sm font-medium">
        <li><a href="search.html" class="text-gray-600 hover:text-gray-900">Buy</a></li>
        <li><a href="search.html" class="text-gray-600 hover:text-gray-900">Rent</a></li>
        <li><a href="search.html" class="text-gray-600 hover:text-gray-900">Lease</a></li>
        <li><a href="#" class="text-gray-600 hover:text-gray-900">International</a></li>
        <li><a href="#" class="text-gray-600 hover:text-gray-900">About</a></li>
        <li><a href="#" class="text-gray-600 hover:text-gray-900">Contact</a></li>
      </ul>

      <div class="flex items-center gap-3">
        <a href="login.html" class="border border-gray-300 text-gray-800 text-sm font-medium px-4 py-2 rounded-lg hover:bg-gray-50 transition">Login</a>
        <a href="login.html" class="bg-brand-green hover:bg-brand-green-dark text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Sign Up</a>
      </div>
    </nav>
  </header>

  <!-- ================= BREADCRUMB ================= -->
  <div class="max-w-7xl mx-auto px-6 pt-6">
    <nav class="flex items-center gap-2 text-sm text-gray-500">
      <a href="landing.html" class="hover:text-emerald-900">Home</a>
      <span>/</span>
      <a href="search.html" class="hover:text-emerald-900">Buy</a>
      <span>/</span>
      <span id="breadcrumb-location" class="text-gray-800 font-medium">Loading…</span>
    </nav>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <main id="property-content" class="max-w-7xl mx-auto px-6 py-6">
    <!-- Rendered by JS -->
  </main>

  <!-- ================= LIGHTBOX ================= -->
  <div id="lightbox" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4">
    <button id="close-lightbox" class="absolute top-5 right-5 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <img id="lightbox-image" src="" alt="" class="max-h-[90vh] max-w-[95vw] object-contain rounded-lg" />
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    /* ---------- PROPERTY DATA (must match search.html) ---------- */
    const properties = [
      { id: 1,  title: "5 Bedroom Detached Duplex",  price: "₦185,000,000", location: "Ikoyi, Lagos",           beds: 5, baths: 6, sqm: 420, tag: "For Sale", coords: [6.4541, 3.4346], image: "https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=800&q=80" },
      { id: 2,  title: "4 Bedroom Luxury Apartment",  price: "₦8,500,000 / year", location: "Lekki Phase 1, Lagos", beds: 4, baths: 4, sqm: 280, tag: "For Rent", coords: [6.4478, 3.4723], image: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=800&q=80" },
      { id: 3,  title: "4 Bedroom Semi-Detached Duplex", price: "₦135,000,000", location: "Chevron, Lekki, Lagos", beds: 4, baths: 5, sqm: 280, tag: "For Sale", coords: [6.4401, 3.5374], image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" },
      { id: 4,  title: "3 Bedroom Apartment",        price: "₦5,500,000 / year", location: "Victoria Island, Lagos", beds: 3, baths: 5, sqm: 220, tag: "For Rent", coords: [6.4281, 3.4219], image: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=800&q=80" },
      { id: 5,  title: "5 Bedroom Detached House",   price: "₦95,000,000",   location: "Ajah, Lagos",             beds: 5, baths: 5, sqm: 350, tag: "For Sale", coords: [6.4698, 3.5852], image: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=800&q=80" },
      { id: 6,  title: "3 Bedroom Penthouse Apartment", price: "₦18,000,000 / year", location: "Banana Island, Ikoyi, Lagos", beds: 3, baths: 4, sqm: 260, tag: "For Rent", coords: [6.4446, 3.4440], image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80" },
      { id: 7,  title: "6 Bedroom Mansion",          price: "₦450,000,000",  location: "Maitama, Abuja",        beds: 6, baths: 7, sqm: 800, tag: "For Sale", coords: [9.0765, 7.3986], image: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80" },
      { id: 8,  title: "2 Bedroom Flat",             price: "₦3,200,000 / year", location: "Yaba, Lagos",        beds: 2, baths: 2, sqm: 120, tag: "For Rent", coords: [6.5076, 3.3713], image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=800&q=80" },
      { id: 9,  title: "4 Bedroom Terrace Duplex",   price: "₦120,000,000",  location: "Gwarinpa, Abuja",       beds: 4, baths: 5, sqm: 300, tag: "For Sale", coords: [9.1110, 7.4049], image: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80" },
      { id: 10, title: "Studio Apartment",           price: "₦1,800,000 / year", location: "Surulere, Lagos",    beds: 1, baths: 1, sqm: 60,  tag: "For Rent", coords: [6.5017, 3.3587], image: "https://images.unsplash.com/photo-1502672023488-70e25813eb80?auto=format&fit=crop&w=800&q=80" },
      { id: 11, title: "5 Bedroom Duplex",           price: "₦220,000,000",  location: "Asokoro, Abuja",        beds: 5, baths: 6, sqm: 450, tag: "For Sale", coords: [9.0423, 7.5223], image: "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=800&q=80" },
      { id: 12, title: "3 Bedroom Bungalow",         price: "₦4,000,000 / year", location: "Ikeja, Lagos",       beds: 3, baths: 3, sqm: 180, tag: "For Rent", coords: [6.6018, 3.3515], image: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=800&q=80" },
    ];

    /* Gallery images (reuse the main image plus a few extras for the same property) */
    const gallerySets = {
      default: [
        "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=1200&q=80",
      ],
    };

    /* ---------- READ ?id= FROM URL ---------- */
    function getIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'), 10);
      return isNaN(id) ? 1 : id;
    }

    /* Handle the ID from duplicated listings (search.html adds +100 / +200) */
    function findProperty(id) {
      if (properties.find(p => p.id === id)) return properties.find(p => p.id === id);
      const baseId = id % 100 || id;
      return properties.find(p => p.id === baseId) || properties[0];
    }

    const property = findProperty(getIdFromUrl());
    const gallery = [property.image, ...gallerySets.default];

    /* ---------- RENDER PAGE ---------- */
    function render() {
      document.title = `${property.title} — HomelyNG`;
      document.getElementById('breadcrumb-location').textContent = property.location;

      const tagColor = property.tag === 'For Sale'
        ? 'bg-brand-green text-white'
        : 'bg-yellow-400 text-gray-900';

      document.getElementById('property-content').innerHTML = `

        <!-- ===== IMAGE GALLERY ===== -->
        <section class="mb-8">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- Main image -->
            <div class="md:col-span-2 relative rounded-xl overflow-hidden h-72 sm:h-96 cursor-pointer group"
                 onclick="openLightbox('${gallery[0]}')">
              <img src="${gallery[0]}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${property.title}" />
              <span class="absolute top-4 left-4 ${tagColor} text-xs font-semibold px-3 py-1.5 rounded">${property.tag}</span>
              <button class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/90 hover:bg-white flex items-center justify-center transition" onclick="event.stopPropagation();">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
              </button>
            </div>

            <!-- Thumbnail stack -->
            <div class="grid grid-cols-2 md:grid-cols-1 gap-3">
              ${gallery.slice(1, 5).map((img, i) => `
                <div class="relative rounded-xl overflow-hidden h-32 sm:h-[112px] cursor-pointer group"
                     onclick="openLightbox('${img}')">
                  <img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="Gallery ${i + 2}" />
                  ${i === 3 ? `<div class="absolute inset-0 bg-black/50 flex items-center justify-center text-white text-sm font-semibold">+${gallery.length - 4} more</div>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        </section>

        <!-- ===== MAIN GRID ===== -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

          <!-- LEFT: Details -->
          <div class="lg:col-span-2 space-y-8">

            <!-- Title & price -->
            <div>
              <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">${property.title}</h1>
              <p class="text-sm text-gray-500 flex items-center gap-1.5 mt-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                ${property.location}
              </p>
              <p class="text-3xl font-bold text-brand-green mt-4">${property.price}</p>
            </div>

            <!-- Quick specs -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div class="bg-white border border-gray-200 rounded-xl p-4 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-brand-green mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <p class="font-bold text-gray-900">${property.beds}</p>
                <p class="text-xs text-gray-500">Bedrooms</p>
              </div>
              <div class="bg-white border border-gray-200 rounded-xl p-4 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-brand-green mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <p class="font-bold text-gray-900">${property.baths}</p>
                <p class="text-xs text-gray-500">Bathrooms</p>
              </div>
              <div class="bg-white border border-gray-200 rounded-xl p-4 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-brand-green mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <p class="font-bold text-gray-900">${property.sqm}</p>
                <p class="text-xs text-gray-500">Sq. meters</p>
              </div>
              <div class="bg-white border border-gray-200 rounded-xl p-4 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-brand-green mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622C17.176 19.29 21 14.591 21 9c0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                <p class="font-bold text-gray-900">Verified</p>
                <p class="text-xs text-gray-500">Status</p>
              </div>
            </div>

            <!-- Description -->
            <div>
              <h2 class="text-lg font-bold text-gray-900 mb-3">Description</h2>
              <p class="text-sm text-gray-600 leading-relaxed">
                This stunning ${property.title.toLowerCase()} is located in ${property.location}. Featuring ${property.beds} spacious bedrooms, ${property.baths} modern bathrooms, and approximately ${property.sqm} square meters of living space, it's the perfect blend of comfort and luxury. Move-in ready, fully fitted kitchen, ample parking, 24/7 security, and easy access to major roads, schools, and shopping.
              </p>
            </div>

            <!-- Amenities -->
            <div>
              <h2 class="text-lg font-bold text-gray-900 mb-3">Amenities</h2>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                ${[
                  '24/7 Security',
                  'Air Conditioning',
                  'Fitted Kitchen',
                  'Parking Space',
                  'Swimming Pool',
                  'Gym Access',
                  'Balcony',
                  'Water Supply',
                  'Backup Power',
                ].map(a => `
                  <div class="flex items-center gap-2 text-sm text-gray-700 bg-white border border-gray-200 rounded-lg px-3 py-2.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-brand-green flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    ${a}
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Location / map -->
            <div>
              <h2 class="text-lg font-bold text-gray-900 mb-3">Location</h2>
              <div id="property-map" class="rounded-xl overflow-hidden border border-gray-200"></div>
            </div>

          </div>

          <!-- RIGHT: Sticky action card -->
          <aside class="lg:col-span-1">
            <div class="lg:sticky lg:top-24 space-y-4">

              <!-- Agent card -->
              <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Listed by</p>
                <div class="flex items-center gap-3 mb-5">
                  <div class="w-12 h-12 rounded-full bg-brand-green text-white flex items-center justify-center font-bold">PH</div>
                  <div>
                    <p class="font-semibold text-gray-900">Prime Homes Ltd</p>
                    <p class="text-xs text-gray-500">Verified Agent · Lagos</p>
                  </div>
                </div>

                <!-- Contact form -->
                <form class="space-y-3" onsubmit="event.preventDefault(); alert('Message sent! The agent will contact you soon.');">
                  <input type="text" placeholder="Your name"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800" />
                  <input type="email" placeholder="Your email"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800" />
                  <input type="tel" placeholder="Phone number"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800" />
                  <textarea rows="3" placeholder="I'm interested in this property…"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800 resize-none"></textarea>
                  <button type="submit"
                    class="w-full bg-brand-green hover:bg-brand-green-dark text-white font-semibold py-3 rounded-lg transition">
                    Request Info
                  </button>
                </form>

                <div class="grid grid-cols-2 gap-2 mt-3">
                  <a href="tel:+2348000000000"
                    class="text-center border border-gray-300 hover:bg-gray-50 text-gray-800 text-sm font-medium py-2.5 rounded-lg transition">
                    📞 Call
                  </a>
                  <a href="https://wa.me/2348000000000"
                    class="text-center border border-gray-300 hover:bg-gray-50 text-gray-800 text-sm font-medium py-2.5 rounded-lg transition">
                    💬 WhatsApp
                  </a>
                </div>
              </div>

              <!-- Mortgage / info -->
              <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-5">
                <p class="text-xs font-semibold text-emerald-900 uppercase tracking-wide mb-2">Estimate</p>
                <p class="text-sm text-emerald-900 leading-relaxed">
                  Monthly payment from <strong>₦850,000</strong> (20% down, 15-year mortgage).
                </p>
                <a href="#" class="text-xs font-semibold text-emerald-900 underline mt-2 inline-block">Learn more</a>
              </div>

            </div>
          </aside>

        </div>

        <!-- ===== SIMILAR PROPERTIES ===== -->
        <section class="mt-16">
          <h2 class="text-xl font-bold text-gray-900 mb-6">Similar Properties</h2>
          <div id="similar-properties" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>
        </section>
      `;

      renderSimilar();
      initMap();
    }

    /* ---------- SIMILAR PROPERTIES ---------- */
    function renderSimilar() {
      const container = document.getElementById('similar-properties');
      const similar = properties.filter(p => p.id !== property.id).slice(0, 4);

      similar.forEach(p => {
        const tagColor = p.tag === 'For Sale'
          ? 'bg-brand-green text-white'
          : 'bg-yellow-400 text-gray-900';

        container.innerHTML += `
          <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-200 hover:shadow-lg transition group">
            <a href="property.html?id=${p.id}" class="block">
              <div class="relative h-40 overflow-hidden">
                <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${p.title}" />
                <span class="absolute top-3 left-3 ${tagColor} text-xs font-semibold px-2.5 py-1 rounded">${p.tag}</span>
              </div>
              <div class="p-4">
                <p class="font-bold text-gray-900 text-sm">${p.price}</p>
                <p class="text-xs text-gray-600 mt-1 mb-2">${p.title}</p>
                <p class="text-xs text-gray-500">${p.location}</p>
              </div>
            </a>
          </div>
        `;
      });
    }

    /* ---------- LEAFLET MAP ---------- */
    function initMap() {
      const map = L.map('property-map').setView(property.coords, 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19,
      }).addTo(map);

      const icon = L.divIcon({
        className: 'custom-pin',
        html: `<div class="map-pin">${property.location.split(',')[0]}</div>`,
        iconSize: [80, 30],
        iconAnchor: [40, 15],
      });

      L.marker(property.coords, { icon }).addTo(map).openPopup();
    }

    /* ---------- LIGHTBOX ---------- */
    function openLightbox(src) {
      document.getElementById('lightbox-image').src = src;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    document.getElementById('close-lightbox').addEventListener('click', () => {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    });

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') {
        document.getElementById('lightbox').classList.remove('open');
        document.body.style.overflow = '';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('lightbox').classList.remove('open');
        document.body.style.overflow = '';
      }
    });

    /* ---------- GO ---------- */
    render();
  </script>

</body>
</html>
